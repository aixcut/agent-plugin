# Skill 与公开 Tool 的显式映射，供构建和测试使用；Codex 不读取这个文件。
# 用途：阻止 Skill 与实时 Tool manifest 漂移，并让「Skill 提到的 Tool 必须存在」可校验。
# helper 路径相对 plugin/ 根目录。forbidden 里的 Tool 只能以禁止语气出现在正文。
skills:
  - skill: aixcut-basics
    surfaces: [codex-hosted]
    requires: []
    tools:
      required: [aixcut_read]
      optional: []
      forbidden: [aixcut_login]
    helper: null
    references: [references/model.md, references/language.md, references/conversation-guidance.md, references/workflow-host.md]

  - skill: aixcut-captions
    surfaces: [codex-hosted]
    requires: [aixcut-basics]
    tools:
      required: [aixcut_read, aixcut_caption]
      optional: [aixcut_review]
      forbidden: [aixcut_text]
    helper: null
    references: [references/actions.md]

  - skill: aixcut-documents
    surfaces: [codex-hosted]
    requires: [aixcut-basics]
    tools:
      required: [aixcut_document]
      optional: [aixcut_frontend]
      forbidden: []
    actions:
      aixcut_frontend: [prompt_add_document, list_documents]
    helper: null
    references: []

  - skill: aixcut-export
    surfaces: [codex-hosted]
    requires: [aixcut-basics]
    tools:
      required: [aixcut_read, aixcut_review, aixcut_frontend]
      optional: [aixcut_open]
      forbidden: []
    # 页内导出归本 Skill；取帧和上传归 aixcut-timeline-editing。
    actions:
      aixcut_frontend: [export_timeline, export_timeline_status]
    helper: null
    references: [references/actions.md]

  - skill: aixcut-generation
    surfaces: [codex-hosted]
    requires: [aixcut-basics]
    tools:
      required: [aixcut_read, aixcut_generate]
      optional: [aixcut_review, aixcut_timeline]
      forbidden: []
    actions:
      aixcut_generate: [quote, submit, get, list, cancel]
    helper: null
    references: [references/providers.md]

  - skill: aixcut-known-errors
    surfaces: [codex-hosted]
    requires: [aixcut-basics]
    tools:
      required: []
      optional: [aixcut_open, aixcut_read, aixcut_frontend, aixcut_project, aixcut_track, aixcut_audio]
      forbidden: []
    helper: null
    references: []

  - skill: aixcut-login
    surfaces: [codex-hosted]
    requires: [aixcut-basics]
    tools:
      required: [aixcut_login]
      optional: []
      forbidden: []
    helper: null
    references: []

  - skill: aixcut-mcp-logout
    surfaces: [codex-hosted]
    requires: [aixcut-basics]
    tools:
      required: [aixcut_logout]
      optional: []
      forbidden: []
    helper: null
    references: []

  - skill: aixcut-projects
    surfaces: [codex-hosted]
    requires: [aixcut-basics]
    tools:
      required: [aixcut_open, aixcut_read]
      optional: [aixcut_exit_project, aixcut_frontend]
      forbidden: [aixcut_login]
    # 只用来在打开页面之后做只读的 page_status 确认，不承担取帧/导出。
    actions:
      aixcut_frontend: [page_status]
    helper: null
    references: []

  - skill: aixcut-talking-head
    surfaces: [codex-hosted]
    requires: [aixcut-basics, aixcut-timeline-editing]
    tools:
      required: [aixcut_read, aixcut_speech, aixcut_caption]
      optional: [aixcut_clip, aixcut_audio, aixcut_review]
      forbidden: [aixcut_text]
    helper: null
    references: []

  - skill: aixcut-timeline-editing
    surfaces: [codex-hosted]
    requires: [aixcut-basics]
    tools:
      required:
        - aixcut_read
        - aixcut_timeline
        - aixcut_primary
        - aixcut_speech
        - aixcut_clip
        - aixcut_text
        - aixcut_audio
        - aixcut_track
        - aixcut_project
        - aixcut_frontend
      optional: [aixcut_review]
      forbidden: [aixcut_login]
    # 取帧和上传归本 Skill；页内导出归 aixcut-export。
    actions:
      aixcut_frontend:
        [
          page_status,
          capture_source_frames,
          capture_timeline_frames,
          playback_check,
          prompt_add_material,
          prompt_add_document,
          list_documents,
          import_local_media,
          import_status,
          export_timeline,
          export_timeline_status,
          media.list,
          media.inspect,
          media.add,
          media.local_status,
          media.prepare_local,
          media.bind_local,
          media.copy_to_opfs,
          media.save_to_disk,
          media.upload,
          media.delete,
          media.delete_cloud,
          media.associate_remote,
          media.resolve_cloud_url,
          media.replace_source,
          media.extract_audio,
          media.analyze,
          media.capture_frame,
          timeline.capture_frame,
          media.export_range,
          timeline.export_range,
          operation.get,
          operation.cancel,
          operation.retry,
        ]
    helper: plugin-core/helpers/download-capture-artifacts.mjs
    references: [references/actions.md, references/frontend-actions.md]

  - skill: aixcut-verification
    surfaces: [codex-hosted]
    requires: [aixcut-basics]
    tools:
      required: [aixcut_read, aixcut_review]
      optional: [aixcut_frontend]
      forbidden: []
    helper: plugin-core/helpers/download-capture-artifacts.mjs
    references: [references/actions.md]

  - skill: aixcut-video-assembly
    surfaces: [codex-hosted]
    requires: [aixcut-basics]
    tools:
      required: [aixcut_read, aixcut_timeline, aixcut_primary, aixcut_generate, aixcut_audio, aixcut_caption, aixcut_review, aixcut_frontend]
      optional: [aixcut_generate]
      forbidden: []
    actions:
      aixcut_frontend: [export_timeline, export_timeline_status]
      aixcut_generate: [submit, quote, get, list, cancel]
    helper: null
    references: [references/pipeline.md]

  - skill: aixcut-voice
    surfaces: [codex-hosted]
    requires: [aixcut-basics]
    tools:
      required: [aixcut_read, aixcut_generate]
      optional: [aixcut_review, aixcut_audio]
      forbidden: []
    actions:
      aixcut_generate: [catalog, speech_read, speech_edit, speech_quote, speech_submit, get]
      aixcut_audio: [add]
    helper: null
    references: [references/actions.md, references/video-sync.md]
